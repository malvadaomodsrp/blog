<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Painel | Malvadão Mods</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><a class="brand" href="./"><img src="assets/panda.png" alt="Logo"><span>MALVADÃO <b>MODS</b></span></a><nav><a href="./">← Ver blog</a><button id="logout" class="link-btn" hidden>Sair</button></nav></header><main class="container admin-container"><div id="login-panel" class="panel login"><span class="eyebrow">ACESSO RESTRITO</span><h1>PAINEL <em>ADMIN</em></h1><p>Entre como Malvadao para gerenciar as publicações.</p><form id="login-form"><label>Usuário<input value="Malvadao" disabled autocomplete="username"></label><label>E-mail administrativo cadastrado no Supabase<input id="email" type="email" required autocomplete="email" placeholder="seu-email@exemplo.com"></label><label>Senha<input id="password" type="password" required autocomplete="current-password"></label><button class="btn" type="submit">ENTRAR</button></form><p id="login-msg" class="status" role="status"></p></div><div id="dashboard" hidden><div class="section-title"><div><span class="eyebrow">LOGADO COMO MALVADAO</span><h1>GERENCIAR <em>POSTS</em></h1></div></div><div class="admin-grid"><section class="panel"><h2 id="form-title">Nova publicação</h2><form id="post-form"><input id="post-id" type="hidden"><label>Título *<input id="title" maxlength="140" required placeholder="Ex.: Novo mod de GTA RP"></label><label>Descrição *<textarea id="description" rows="6" required maxlength="10000" placeholder="Escreva o conteúdo da publicação..."></textarea></label><label>Link da imagem (https://)<input id="image-url" type="url" placeholder="https://site.com/imagem.jpg"></label><label>Link do vídeo do YouTube<input id="youtube-url" type="url" placeholder="https://www.youtube.com/watch?v=..."></label><label class="check"><input id="published" type="checkbox" checked> Publicar agora (visível para todos)</label><div class="actions"><button class="btn" type="submit">SALVAR PUBLICAÇÃO</button><button id="cancel" type="button" class="btn ghost">LIMPAR</button></div></form><p id="form-msg" class="status" role="status"></p></section><section class="panel"><h2>Minhas publicações</h2><div id="admin-posts" class="admin-posts">Carregando...</div></section></div></div></main><script type="module" src="admin.js"></script></body></html>
